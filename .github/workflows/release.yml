name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate application tag against the workspace version
        run: python .github/scripts/release.py validate

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: application-release-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-x64-installer
          path: release-assets
      - name: Prepare release notes and updater manifest
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py prepare --assets release-assets
      - name: Create or resume the draft and upload release assets
        if: steps.prepare.outputs.publish == 'true'
        id: release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: nib ${{ steps.prepare.outputs.version }}
          body_path: release-assets/release-notes.md
          draft: true
          prerelease: false
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*-setup.exe.sig
            release-assets/latest.json
      - name: Verify uploaded contents and publish by release ID
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: python .github/scripts/release.py finalize --assets release-assets --release-id "$RELEASE_ID"
