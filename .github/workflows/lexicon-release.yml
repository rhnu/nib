name: Publish lexicon candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Lexicon candidate workflow run ID
        type: string
        required: true
      release_id:
        description: Candidate immutable resource version (lexicon-YYYY.MM.DD.N)
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: lexicon-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify candidate run provenance
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid candidate run ID'; exit 1; }
          [[ "$RELEASE_ID" =~ ^lexicon-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo 'Invalid resource version'; exit 1; }
          gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/candidate-run.json"
          python - <<'PY'
          import json, os, pathlib
          run = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate-run.json").read_text())
          if (run["path"] != ".github/workflows/lexicon-build.yml" or run["head_branch"] != "main"
              or run["conclusion"] != "success" or run["event"] not in ("push", "schedule", "workflow_dispatch")):
              raise SystemExit("Candidate must come from a successful trusted main resource build")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CANDIDATE_SHA={run['head_sha']}\n")
          PY
      - name: Download the reviewed candidate
        uses: actions/download-artifact@v8.0.2
        with:
          name: lexicon-candidate-${{ inputs.release_id }}
          path: candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate identity and resource hashes
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path("candidate")
          metadata = json.loads((root / "candidate.json").read_text())
          if metadata != {"id": os.environ["RELEASE_ID"], "sha": os.environ["CANDIDATE_SHA"]}:
              raise SystemExit("Candidate metadata does not match the selected build")
          package = root / "package"
          manifest = json.loads((package / "lexicon-manifest.json").read_text())
          if manifest["id"] != metadata["id"]:
              raise SystemExit("Manifest resource version does not match the candidate")
          files = [manifest["core"]]
          if manifest.get("semantic"):
              files += [manifest["semantic"]["vectors"], manifest["semantic"]["keys"]]
          if manifest.get("model"):
              files += manifest["model"]["files"]
          for entry in files:
              path = package / entry["path"]
              if path.parent != package or not path.is_file():
                  raise SystemExit("Candidate resource path is invalid")
              if path.stat().st_size != entry["bytes"] or hashlib.file_digest(path.open("rb"), "sha256").hexdigest() != entry["sha256"]:
                  raise SystemExit(f"Candidate resource hash mismatch: {path.name}")
          PY
      - name: Resume immutable publication and update the current pointer last
        run: |
          python .github/scripts/publish-lexicon.py --package candidate/package \
            --id "$RELEASE_ID" --sha "$CANDIDATE_SHA" --run-id "$RUN_ID"
