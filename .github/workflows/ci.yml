name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Rusteward
        uses: rhnu/rusteward@main

      - name: Install rumdl
        uses: rvben/rumdl@v0
        with:
          version: "0.2.79"
          install-only: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build desktop executable
        run: pnpm build:desktop

      - name: Verify checks preserved tracked files
        run: git diff --exit-code
