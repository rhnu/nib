name: Set up Rust
description: Install the pinned toolchain and restore caches separated by native profile and target.
inputs:
  cache-key:
    description: Build profile and target identity for this job.
    required: true
  targets:
    description: Additional Rust targets.
    default: ""
  workspaces:
    description: Workspace to target-directory mappings, including any separate WASM target directory.
    default: ". -> target"
  rusteward:
    description: Install Rusteward for format and lint checks.
    default: "false"
runs:
  using: composite
  steps:
    - name: Set ONNX Runtime download cache
      shell: bash
      env:
        ORT_DOWNLOAD_CACHE: ${{ runner.tool_cache }}/ort
      run: echo "ORT_CACHE_DIR=$ORT_DOWNLOAD_CACHE" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: "1.99.0"
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
        cache-workspace-crates: true
        cache-bin: false
        cache-directories: ${{ runner.tool_cache }}/ort
        save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    - uses: rhnu/rusteward@main
      if: inputs.rusteward == 'true'
