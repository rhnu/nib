[workspace]
members = ["modules/app", "apps/desktop/src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
nib-app = { path = "modules/app" }
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
novelai-bridge = { version = "0.7.2", default-features = false, features = ["reqwest-transport", "bundled-assets"] }
futures-util = "0.3.34"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
secrecy = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.4"
tauri-build = "2.7.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.0", features = ["rt", "sync", "macros", "time"] }
ts-rs = "12.0.1"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

