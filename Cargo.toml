[workspace]
members = ["modules/app", "modules/contract", "modules/prompt", "modules/lexicon", "modules/resources", "modules/image-analysis", "modules/inference-runtime", "apps/desktop/src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
nib-app = { path = "modules/app" }
nib-contract = { path = "modules/contract" }
nib-prompt = { path = "modules/prompt" }
nib-lexicon = { path = "modules/lexicon" }
nib-resources = { path = "modules/resources" }
nib-image-analysis = { path = "modules/image-analysis" }
nib-inference-runtime = { path = "modules/inference-runtime" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
csv = "1.4.0"
flate2 = "1.1.10"
half = "2.7.1"
sha2 = "0.11.1"
wide = "1.7.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "copy-dylibs", "tls-native", "api-31"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking", "json"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
novelai-bridge = { version = "0.8.1", default-features = false, features = ["reqwest-transport", "bundled-assets"] }
novelai-bridge-prompt = "0.1.0"
futures-util = "0.3.34"
rig-core = { version = "0.46.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.46.0", default-features = false }
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
secrecy = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.4"
tauri-build = "2.7.3"
webview2-com = "0.39.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
tauri-plugin-updater = "2.14.1"
sys-locale = "0.3.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
ts-rs = "12.0.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

